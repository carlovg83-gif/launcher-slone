<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" width="100%" height="100%">
  <defs>
    <!-- Gradiente metálico titanio / champán sobrio -->
    <linearGradient id="titanium" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
    <linearGradient id="nordicGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#F3E5AB" />
      <stop offset="100%" stop-color="#C5A059" />
    </linearGradient>
  </defs>

  <!-- ISOTIPO SOBERANO SL.1 / Ö (Monograma Arquitectónico) -->
  <g transform="translate(10, 15)">
    <!-- Órbita geométrica exterior (O de SL.ONE) -->
    <circle cx="45" cy="45" r="40" fill="none" stroke="url(#titanium)" stroke-width="5" opacity="0.95"/>
    
    <!-- El '1' arquitectónico central integrado en la O (SL1 / SL.ONE) -->
    <path d="M40 28 L45 23 L45 66 M35 66 L55 66" fill="none" stroke="url(#nordicGold)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Diéresis de ultra-precisión (Satélites soberanos) -->
    <circle cx="33" cy="4" r="4.5" fill="url(#nordicGold)" />
    <circle cx="57" cy="4" r="4.5" fill="url(#nordicGold)" />
  </g>

  <!-- LOGOTIPO TIPOGRÁFICO MINIMALISTA (Estilo Suizo / Grotesk) -->
  <g transform="translate(125, 68)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Helvetica Neue', sans-serif" 
          font-size="44" 
          font-weight="800" 
          letter-spacing="14" 
          fill="url(#titanium)">
      SLÖNE
    </text>
  </g>

  <!-- MICRO-IDENTIDAD DE ALTA GAMA -->
  <g transform="translate(128, 88)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif" 
          font-size="9" 
          font-weight="700" 
          letter-spacing="5" 
          fill="url(#nordicGold)" 
          opacity="0.9">
      SOVEREIGN MEDIA SUITE · SL.ONE
    </text>
  </g>
</svg>
