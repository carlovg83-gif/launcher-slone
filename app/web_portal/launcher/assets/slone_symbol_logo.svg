<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="symTitanium" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
    <linearGradient id="symGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#F3E5AB" />
      <stop offset="100%" stop-color="#C5A059" />
    </linearGradient>
  </defs>

  <!-- Fondo circular sutil con marco de precisión -->
  <rect width="100" height="100" rx="28" fill="#0B0F17" />
  <rect width="98" height="98" x="1" y="1" rx="27" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />

  <!-- Órbita geométrica exterior (Ö / O) -->
  <circle cx="50" cy="56" r="32" fill="none" stroke="url(#symTitanium)" stroke-width="4.5" opacity="0.95"/>
  
  <!-- El '1' arquitectónico central (SL.1 / SL.ONE) -->
  <path d="M45 42 L50 37 L50 71 M41 71 L59 71" fill="none" stroke="url(#symGold)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Diéresis de ultra-precisión (Satélites soberanos) -->
  <circle cx="40" cy="14" r="3.8" fill="url(#symGold)" />
  <circle cx="60" cy="14" r="3.8" fill="url(#symGold)" />
</svg>
