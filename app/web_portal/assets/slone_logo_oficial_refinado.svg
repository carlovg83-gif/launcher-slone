<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Gradiente de alta precisión en Amarillo Neón Eléctrico -->
    <linearGradient id="neonRefined" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="20%" stop-color="#E3FF00"/>
      <stop offset="100%" stop-color="#B2E600"/>
    </linearGradient>

    <filter id="subtleAura" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Máscara de Precisión Óptica Mejorada -->
    <mask id="optMask">
      <rect width="600" height="600" fill="#FFFFFF"/>
      
      <!-- Hueco central interior (R=112) -->
      <circle cx="300" cy="335" r="112" fill="#000000"/>

      <!-- Muesca de centrado en el ápice superior con curvatura continua (R=14) -->
      <circle cx="300" cy="144" r="15" fill="#000000"/>

      <!-- Canal concéntrico de frecuencia acústica (R=150, ancho 8px) -->
      <circle cx="300" cy="335" r="150" fill="none" stroke="#000000" stroke-width="8"/>

      <!-- Puentes de fase calibrados matemáticamente a 0°, 45°, 90°, 135°, 180°, 225°, 270°, 315° -->
      <g stroke="#FFFFFF" stroke-width="14">
        <!-- Verticales y horizontales -->
        <line x1="300" y1="175" x2="300" y2="195"/>
        <line x1="300" y1="475" x2="300" y2="495"/>
        <line x1="140" y1="335" x2="160" y2="335"/>
        <line x1="440" y1="335" x2="460" y2="335"/>
        <!-- Diagonales áureas a 45 grados -->
        <line x1="187" y1="222" x2="201" y2="236"/>
        <line x1="399" y1="236" x2="413" y2="222"/>
        <line x1="187" y1="448" x2="201" y2="434"/>
        <line x1="399" y1="434" x2="413" y2="448"/>
      </g>

      <!-- Muescas perimetrales de indexación (cortes milimétricos en el contorno exterior) -->
      <circle cx="300" cy="526" r="7.5" fill="#000000"/>
      <circle cx="108" cy="335" r="7.5" fill="#000000"/>
      <circle cx="492" cy="335" r="7.5" fill="#000000"/>
      <circle cx="165" cy="200" r="7.5" fill="#000000"/>
      <circle cx="435" cy="200" r="7.5" fill="#000000"/>
      <circle cx="165" cy="470" r="7.5" fill="#000000"/>
      <circle cx="435" cy="470" r="7.5" fill="#000000"/>
    </mask>
  </defs>

  <rect width="600" height="600" fill="#000000"/>

  <!-- GRABADO EN SECO (DEBOSS) ÓPTICO DE FONDO -->
  <circle cx="300" cy="335" r="226" fill="none" stroke="#0E131E" stroke-width="2.5"/>
  <circle cx="300" cy="335" r="94" fill="none" stroke="#0C1019" stroke-width="2"/>

  <!-- GRUPO PRINCIPAL CON REFINAMIENTO ÓPTICO -->
  <g filter="url(#subtleAura)">
    <!-- 1. ANILLO ACÚSTICO REFINADO -->
    <circle cx="300" cy="335" r="192" fill="url(#neonRefined)" mask="url(#optMask)"/>

    <!-- 2. CÁPSULAS DIÉRESIS CON INCLINACIÓN CONCÉNTRICA ARMONIZADA (-6° y +6°) -->
    <!-- Mejora: Al inclinar ligeramente las cápsulas 6 grados hacia el centro, abrazan la curvatura del círculo exterior -->
    <g transform="translate(242, 102) rotate(-6)">
      <rect x="-42" y="-19" width="84" height="38" rx="19" fill="url(#neonRefined)"/>
      <!-- Micro-orificio focal central sutil (profundidad de ingeniería) -->
      <circle cx="0" cy="0" r="4.5" fill="#000000" opacity="0.9"/>
    </g>

    <g transform="translate(358, 102) rotate(6)">
      <rect x="-42" y="-19" width="84" height="38" rx="19" fill="url(#neonRefined)"/>
      <circle cx="0" cy="0" r="4.5" fill="#000000" opacity="0.9"/>
    </g>
  </g>

  <!-- LÍNEAS GUÍA DE PRECISIÓN MILIMÉTRICA -->
  <g stroke="#162232" stroke-width="1" stroke-dasharray="3,3" opacity="0.5">
    <line x1="300" y1="20" x2="300" y2="580"/>
    <line x1="20" y1="335" x2="580" y2="335"/>
    <circle cx="300" cy="335" r="150" fill="none" stroke="#00F0FF" stroke-width="0.75" stroke-dasharray="2,4" opacity="0.4"/>
  </g>
</svg>
