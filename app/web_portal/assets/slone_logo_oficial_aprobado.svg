<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Filtro de sombra de profundidad suave en papel mate -->
    <filter id="debossShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
    <filter id="neonSubtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#E3FF00" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- FONDO NEGRO MATE AZABACHE -->
  <rect width="600" height="600" fill="#000000"/>

  <!-- GRABADO EN SECO (DEBOSS) EN EL PAPEL DE FONDO -->
  <circle cx="300" cy="335" r="225" fill="none" stroke="#101520" stroke-width="2"/>
  <circle cx="300" cy="335" r="95" fill="none" stroke="#0E121B" stroke-width="2"/>

  <!-- GRUPO PRINCIPAL DEL LOGO 'Ö' OFICIAL -->
  <g id="slone-official-glyph" filter="url(#neonSubtleGlow)">

    <!-- 1. ANILLO ACÚSTICO PRINCIPAL CON CANAL CONCÉNTRICO Y MUESCAS DE PRECISIÓN -->
    <!-- Máscara para recortar el canal concéntrico central, la muesca de ápice y las ranuras -->
    <mask id="ringPrecisionMask">
      <!-- Relleno base blanco (todo visible) -->
      <rect width="600" height="600" fill="#FFFFFF"/>
      
      <!-- Corte del hueco interior del anillo (radio 108) -->
      <circle cx="300" cy="335" r="108" fill="#000000"/>

      <!-- Muesca semicircular de centrado en el ápice superior (R=12) -->
      <circle cx="300" cy="145" r="14" fill="#000000"/>

      <!-- Canal concéntrico ranurado central (radio 148, grosor 7px) -->
      <circle cx="300" cy="335" r="148" fill="none" stroke="#000000" stroke-width="7"/>

      <!-- Puentes/Tabs del canal concéntrico (restauran el canal a 45°, 90°, 135°, 225°, etc.) -->
      <!-- Estos puentes se dibujan con rectángulos blancos que tapan la línea de corte negra -->
      <g stroke="#FFFFFF" stroke-width="12">
        <line x1="300" y1="180" x2="300" y2="195"/> <!-- 90 arriba -->
        <line x1="300" y1="475" x2="300" y2="490"/> <!-- 90 abajo -->
        <line x1="145" y1="335" x2="160" y2="335"/> <!-- 180 izq -->
        <line x1="440" y1="335" x2="455" y2="335"/> <!-- 0 der -->
        <!-- Diagonales 45 grados -->
        <line x1="190" y1="225" x2="200" y2="235"/>
        <line x1="400" y1="235" x2="410" y2="225"/>
        <line x1="190" y1="445" x2="200" y2="435"/>
        <line x1="400" y1="435" x2="410" y2="445"/>
      </g>

      <!-- Muescas perimetrales exteriores e interiores de indexación de audio -->
      <circle cx="300" cy="525" r="7" fill="#000000"/> <!-- Muesca abajo -->
      <circle cx="110" cy="335" r="7" fill="#000000"/> <!-- Muesca izquierda -->
      <circle cx="490" cy="335" r="7" fill="#000000"/> <!-- Muesca derecha -->
      <circle cx="165" cy="200" r="7" fill="#000000"/> <!-- Muesca 45 sup-izq -->
      <circle cx="435" cy="200" r="7" fill="#000000"/> <!-- Muesca 45 sup-der -->
      <circle cx="165" cy="470" r="7" fill="#000000"/> <!-- Muesca 45 inf-izq -->
      <circle cx="435" cy="470" r="7" fill="#000000"/> <!-- Muesca 45 inf-der -->
    </mask>

    <!-- El cuerpo sólido del anillo en Amarillo Neón (#E3FF00) con la máscara aplicada -->
    <circle cx="300" cy="335" r="190" fill="#E3FF00" mask="url(#ringPrecisionMask)"/>

    <!-- 2. LAS DOS CÁPSULAS HORIZONTALES DE LA DIÉRESIS (PÍLDORAS DE PRECISIÓN) -->
    <!-- Cápsula Izquierda -->
    <rect x="202" y="85" width="80" height="38" rx="19" fill="#E3FF00"/>

    <!-- Cápsula Derecha -->
    <rect x="318" y="85" width="80" height="38" rx="19" fill="#E3FF00"/>

  </g>

  <!-- LÍNEAS TÉCNICAS SUTILES DE MANUAL DE MARCA (CONSTRUCTION MARKS) -->
  <g stroke="#182232" stroke-width="1" stroke-dasharray="3,3" opacity="0.6">
    <!-- Eje central vertical y horizontal -->
    <line x1="300" y1="30" x2="300" y2="570"/>
    <line x1="30" y1="335" x2="570" y2="335"/>
    <!-- Círculo de tangencia de las cápsulas -->
    <line x1="202" y1="104" x2="398" y2="104"/>
  </g>
</svg>
