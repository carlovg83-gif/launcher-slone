<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="streamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#E3FF00"/>
      <stop offset="100%" stop-color="#7FA800"/>
    </linearGradient>
    <filter id="crispGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="600" height="600" fill="#000000"/>

  <g transform="translate(0, 15)">
    <!-- ANILLO EN VÓRTICE DE STREAMING (CURVATURA CONTINUA G2 CON COMPENSACIÓN DE FLUJO) -->
    <!-- El contorno se engrosa progresivamente simulando la propagación del sonido -->
    <path d="M 300 130
             C 420 130 490 205 490 325
             C 490 445 410 510 295 510
             C 180 510 110 440 110 325
             C 110 215 175 140 280 132
             L 280 198
             C 215 205 175 255 175 325
             C 175 395 225 445 295 445
             C 365 445 425 395 425 325
             C 425 255 375 198 300 198
             Z"
          fill="url(#streamGrad)"
          filter="url(#crispGlow)"/>

    <!-- PUNTOS DIÉRESIS DE PRECISIÓN: SATÉLITES ÓPTICOS CON CORTE TANGENCIAL -->
    <!-- Satélite 1 (Izquierdo) -->
    <g transform="translate(228, 72)">
      <!-- Forma elíptica de transmisión acústica -->
      <path d="M -24 0 C -24 -15 24 -15 24 0 C 24 15 -24 15 -24 0 Z" fill="url(#streamGrad)"/>
      <circle cx="0" cy="0" r="5" fill="#000000"/>
    </g>

    <!-- Satélite 2 (Derecho) -->
    <g transform="translate(372, 72)">
      <path d="M -24 0 C -24 -15 24 -15 24 0 C 24 15 -24 15 -24 0 Z" fill="url(#streamGrad)"/>
      <circle cx="0" cy="0" r="5" fill="#000000"/>
    </g>

    <!-- NODO DE SINCRONIZACIÓN SUTIL -->
    <circle cx="280" cy="165" r="4" fill="#E3FF00"/>
  </g>
</svg>
