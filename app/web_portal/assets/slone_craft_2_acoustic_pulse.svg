<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="neonPulseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#E3FF00"/>
      <stop offset="100%" stop-color="#80A800"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="600" height="600" fill="#000000"/>

  <g transform="translate(0, 15)">
    <!-- ANILLO ÓPTICO SUPERELÍPTICO (SQUIRCLE ACÚSTICO) -->
    <!-- Contorno con compensación óptica: Más grueso en los laterales, apertura armónica arriba -->
    <path d="M 300 135 
             C 415 135 480 205 480 320 
             C 480 435 415 505 300 505 
             C 185 505 120 435 120 320 
             C 120 205 185 135 300 135 Z
             M 300 205 
             C 225 205 185 255 185 320 
             C 185 385 225 435 300 435 
             C 375 435 415 385 415 320 
             C 415 255 375 205 300 205 Z" 
          fill="url(#neonPulseGrad)" 
          fill-rule="evenodd"
          filter="url(#subtleGlow)"/>

    <!-- CANAL DE PRECISIÓN EN EL NODO SUPERIOR (MICRO-CORTE DE FASE 2.5 mm) -->
    <rect x="296" y="130" width="8" height="80" fill="#000000"/>

    <!-- DIÉRESIS DE INGENIERÍA: DOS SATÉLITES TALLADOS CON MICRO-BISEL Y ORIFICIO FOCAL -->
    <!-- Satélite Izquierdo -->
    <g transform="translate(225, 75)">
      <circle cx="0" cy="0" r="28" fill="url(#neonPulseGrad)"/>
      <circle cx="0" cy="0" r="10" fill="#000000"/>
      <!-- Micro muesca de audio a 45 grados -->
      <line x1="-12" y1="-12" x2="12" y2="12" stroke="#000000" stroke-width="3"/>
    </g>

    <!-- Satélite Derecho -->
    <g transform="translate(375, 75)">
      <circle cx="0" cy="0" r="28" fill="url(#neonPulseGrad)"/>
      <circle cx="0" cy="0" r="10" fill="#000000"/>
      <!-- Micro muesca de audio a -45 grados -->
      <line x1="-12" y1="12" x2="12" y2="-12" stroke="#000000" stroke-width="3"/>
    </g>

    <!-- GUÍAS SUTILES DE ALINEACIÓN (DETALLE TÉCNICO INGENIERIL) -->
    <circle cx="300" cy="320" r="1" fill="#E3FF00"/>
  </g>
</svg>
