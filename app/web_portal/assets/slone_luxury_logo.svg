<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 120" width="100%" height="100%">
  <defs>
    <!-- Gradiente Oro Nórdico Cepillado -->
    <linearGradient id="lockupGold" x1="12%" y1="8%" x2="88%" y2="92%">
      <stop offset="0%" stop-color="#FFFDF2" />
      <stop offset="16%" stop-color="#FFE26A" />
      <stop offset="42%" stop-color="#D9A826" />
      <stop offset="68%" stop-color="#FDE895" />
      <stop offset="88%" stop-color="#B8860B" />
      <stop offset="100%" stop-color="#734F0A" />
    </linearGradient>

    <!-- Gradiente Titanio Puro para Tipografía -->
    <linearGradient id="lockupTitanium" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <!-- Gradiente de Bisel Cenital -->
    <linearGradient id="lockupRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="35%" stop-color="#FFE89E" stop-opacity="0.3" />
      <stop offset="75%" stop-color="#543A02" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.5" />
    </linearGradient>

    <!-- Gradiente Radial Lente Satélite -->
    <radialGradient id="lockupSat" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#FFE57E" />
      <stop offset="70%" stop-color="#D4A017" />
      <stop offset="100%" stop-color="#7A4E00" />
    </radialGradient>
  </defs>

  <!-- ISOTIPO SÖBERANÖ G2 PERFECCIONADO (Escalado armónico a 96px de alto) -->
  <g transform="translate(14, 12) scale(0.235)">
    <!-- Anillo Maestro Sólido (38px) -->
    <circle cx="250" cy="282" r="136" fill="none" stroke="url(#lockupGold)" stroke-width="38" stroke-linecap="round" />
    <circle cx="250" cy="282" r="155.4" fill="none" stroke="url(#lockupRim)" stroke-width="2.5" />
    <circle cx="250" cy="282" r="116.6" fill="none" stroke="url(#lockupRim)" stroke-width="2.5" opacity="0.8" />

    <!-- Polos Satelitales Cuánticos (Alfa & Beta) -->
    <circle cx="182" cy="88" r="26" fill="url(#lockupSat)" />
    <circle cx="182" cy="88" r="26" fill="none" stroke="url(#lockupRim)" stroke-width="2" />
    <circle cx="182" cy="88" r="12" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.6" />
    <circle cx="182" cy="88" r="4.5" fill="#FFFFFF" />

    <circle cx="318" cy="88" r="26" fill="url(#lockupSat)" />
    <circle cx="318" cy="88" r="26" fill="none" stroke="url(#lockupRim)" stroke-width="2" />
    <circle cx="318" cy="88" r="12" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.6" />
    <circle cx="318" cy="88" r="4.5" fill="#FFFFFF" />
  </g>

  <!-- TIPOGRAFÍA INSTITUCIONAL: SLÖNE CÖRP (Pure Grotesk con Ö soberana en CÖRP) -->
  <g transform="translate(130, 68)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Helvetica Neue', Arial, sans-serif" 
          font-size="44" 
          font-weight="900" 
          letter-spacing="10" 
          fill="url(#lockupTitanium)">
      SLÖNE CÖRP
    </text>
  </g>

  <!-- DESCRIPTOR DE INGENIERÍA SÖBERANA -->
  <g transform="translate(134, 90)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif" 
          font-size="9" 
          font-weight="800" 
          letter-spacing="5" 
          fill="url(#lockupGold)" 
          opacity="0.95">
      SÖVEREIGN MEDIA SUITE · 0 MS SYNC
    </text>
  </g>
</svg>
