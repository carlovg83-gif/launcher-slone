<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Máscara del Isotipo para el Anillo Acústico -->
    <mask id="hRingMask">
      <rect width="360" height="360" fill="#FFFFFF"/>
      <circle cx="180" cy="195" r="66" fill="#000000"/>
      <!-- Muesca superior -->
      <circle cx="180" cy="80" r="9" fill="#000000"/>
      <!-- Canal ranurado central -->
      <circle cx="180" cy="195" r="90" fill="none" stroke="#000000" stroke-width="4.5"/>
      <!-- Puentes del canal a 90 y 45 grados -->
      <g stroke="#FFFFFF" stroke-width="8">
        <line x1="180" y1="100" x2="180" y2="110"/>
        <line x1="180" y1="280" x2="180" y2="290"/>
        <line x1="85" y1="195" x2="95" y2="195"/>
        <line x1="265" y1="195" x2="275" y2="195"/>
        <line x1="113" y1="128" x2="120" y2="135"/>
        <line x1="240" y1="135" x2="247" y2="128"/>
        <line x1="113" y1="262" x2="120" y2="255"/>
        <line x1="240" y1="255" x2="247" y2="262"/>
      </g>
      <!-- Muescas perimetrales -->
      <circle cx="180" cy="310" r="4.5" fill="#000000"/>
      <circle cx="65" cy="195" r="4.5" fill="#000000"/>
      <circle cx="295" cy="195" r="4.5" fill="#000000"/>
      <circle cx="98" cy="113" r="4.5" fill="#000000"/>
      <circle cx="262" cy="113" r="4.5" fill="#000000"/>
      <circle cx="98" cy="277" r="4.5" fill="#000000"/>
      <circle cx="262" cy="277" r="4.5" fill="#000000"/>
    </mask>
  </defs>

  <!-- FONDO NEGRO PURO -->
  <rect width="1200" height="360" fill="#000000"/>

  <!-- 1. ISOTIPO 'Ö' OFICIAL A LA IZQUIERDA -->
  <g transform="translate(40, 0)">
    <!-- Anillo con canal de precisión -->
    <circle cx="180" cy="195" r="115" fill="#E3FF00" mask="url(#hRingMask)"/>

    <!-- Cápsulas diéresis superiores -->
    <rect x="122" y="42" width="50" height="24" rx="12" fill="#E3FF00"/>
    <rect x="188" y="42" width="50" height="24" rx="12" fill="#E3FF00"/>
  </g>

  <!-- 2. WORDMARK OFICIAL "SLÖNE" (TIPOGRAFÍA DISPLAY GEOMÉTRICA) -->
  <g transform="translate(440, 225)">
    <!-- "SL" en Blanco Puro -->
    <text x="0" y="0" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Circular', 'Inter', 'Montserrat', sans-serif" 
          font-size="135" 
          font-weight="900" 
          letter-spacing="5px" 
          fill="#FFFFFF">SL</text>

    <!-- "Ö" en Amarillo Neón Eléctrico (#E3FF00) con cápsulas de precisión -->
    <g transform="translate(192, 0)">
      <!-- Letra O principal -->
      <text x="0" y="0" 
            font-family="system-ui, -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Circular', 'Inter', 'Montserrat', sans-serif" 
            font-size="135" 
            font-weight="900" 
            fill="#E3FF00">O</text>
      <!-- Cápsulas diéresis sobre la O de SLÖNE -->
      <rect x="12" y="-140" width="32" height="15" rx="7.5" fill="#E3FF00"/>
      <rect x="52" y="-140" width="32" height="15" rx="7.5" fill="#E3FF00"/>
    </g>

    <!-- "NE" en Blanco Puro -->
    <text x="312" y="0" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Circular', 'Inter', 'Montserrat', sans-serif" 
          font-size="135" 
          font-weight="900" 
          letter-spacing="5px" 
          fill="#FFFFFF">NE</text>

    <!-- SUBTÍTULO TÉCNICO OFICIAL DE LA MARCA -->
    <text x="6" y="52" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="16" 
          font-weight="800" 
          letter-spacing="9px" 
          fill="#8E9BAE">AUDIO &amp; STREAMING PLATFORM // ECOSYSTEM</text>
  </g>
</svg>
