<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradiente Maestro Oro Nórdico Cepillado / Champagne PVD (Luz Cenital a 130°) -->
    <linearGradient id="sloneGoldMaster" x1="12%" y1="8%" x2="88%" y2="92%">
      <stop offset="0%" stop-color="#FFFDF2" />
      <stop offset="16%" stop-color="#FFE26A" />
      <stop offset="42%" stop-color="#D9A826" />
      <stop offset="68%" stop-color="#FDE895" />
      <stop offset="88%" stop-color="#B8860B" />
      <stop offset="100%" stop-color="#734F0A" />
    </linearGradient>

    <!-- Gradiente de Bisel Cenital para Relieve Óptico Ultra-Preciso -->
    <linearGradient id="rimLightMaster" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="35%" stop-color="#FFE89E" stop-opacity="0.3" />
      <stop offset="75%" stop-color="#543A02" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.5" />
    </linearGradient>

    <!-- Gradiente Radial para Satélites Cuánticos (Lente de Fase 0 ms) -->
    <radialGradient id="satReflectMaster" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#FFE57E" />
      <stop offset="70%" stop-color="#D4A017" />
      <stop offset="100%" stop-color="#7A4E00" />
    </radialGradient>
  </defs>

  <!-- ==============================================================================
       1. ANILLO PRINCIPAL: TORO SÖBERANÖ G2 (TRANSMISIÓN CONTINUA ZERÖ-LAG)
       Centro (250, 282) | Radio medio = 136px | Grosor = 38px
       ============================================================================== -->
  <circle cx="250" cy="282" r="136" 
          fill="none" 
          stroke="url(#sloneGoldMaster)" 
          stroke-width="38" 
          stroke-linecap="round" />

  <!-- Chaflán Perimetral Exterior (Hairline de precisión 1.2px) -->
  <circle cx="250" cy="282" r="155.4" 
          fill="none" 
          stroke="url(#rimLightMaster)" 
          stroke-width="1.2" />

  <!-- Chaflán Perimetral Interior (Reflejo Cóncavo de Fase) -->
  <circle cx="250" cy="282" r="116.6" 
          fill="none" 
          stroke="url(#rimLightMaster)" 
          stroke-width="1.2" 
          opacity="0.8" />

  <!-- ==============================================================================
       2. DIÉRESIS DE FASE: DUAL QUANTUM SATELLITES (EMISOR ALFA & RECEPTOR BETA)
       Radio = 26px | Eje X1 = 182, X2 = 318 | Y = 88
       Tensión Gestalt Vertical: Gap exacto de 13px al anillo | Centrado absoluto
       ============================================================================== -->
  <!-- Polo Alfa (Vídeo 4K / Nodo Emisor) -->
  <circle cx="182" cy="88" r="26" fill="url(#satReflectMaster)" />
  <circle cx="182" cy="88" r="26" fill="none" stroke="url(#rimLightMaster)" stroke-width="1.2" />
  <circle cx="182" cy="88" r="13" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.6" />
  <circle cx="182" cy="88" r="4.5" fill="#FFFFFF" opacity="0.9" />

  <!-- Polo Beta (Multiaudio 0 ms / Nodo Receptor) -->
  <circle cx="318" cy="88" r="26" fill="url(#satReflectMaster)" />
  <circle cx="318" cy="88" r="26" fill="none" stroke="url(#rimLightMaster)" stroke-width="1.2" />
  <circle cx="318" cy="88" r="13" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.6" />
  <circle cx="318" cy="88" r="4.5" fill="#FFFFFF" opacity="0.9" />
</svg>