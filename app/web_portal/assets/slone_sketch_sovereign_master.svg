<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" height="100%">
  <defs>
    <!-- Gradiente Oro Nórdico Cepillado / Champagne PVD (Luz Cenital a 130°) -->
    <linearGradient id="goldFace" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF2" />
      <stop offset="18%" stop-color="#FFE26A" />
      <stop offset="45%" stop-color="#D9A826" />
      <stop offset="75%" stop-color="#FDE895" />
      <stop offset="92%" stop-color="#B8860B" />
      <stop offset="100%" stop-color="#734F0A" />
    </linearGradient>

    <!-- Gradiente de Titanio Cepillado para Contornos -->
    <linearGradient id="rimLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="40%" stop-color="#FFE89E" stop-opacity="0.5" />
      <stop offset="80%" stop-color="#543A02" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.7" />
    </linearGradient>

    <!-- Gradiente de Extrusión 3D Profunda (Bloque Obsidiana con Luz de Rebote) -->
    <linearGradient id="block3D" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#2A303C" />
      <stop offset="40%" stop-color="#121620" />
      <stop offset="100%" stop-color="#05070B" />
    </linearGradient>

    <!-- Bisel de Corte Metálico 3D -->
    <linearGradient id="bevelEdge" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- Resplandor Neón Soberano -->
    <radialGradient id="satGlow" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#FFE57E" />
      <stop offset="70%" stop-color="#D4A017" />
      <stop offset="100%" stop-color="#7A4E00" />
    </radialGradient>
  </defs>

  <!-- ==============================================================================
       CAPA 1: EXTRUSIÓN 3D INFERIOR Y LATERAL (BLOQUE SÓLIDO MECANIZADO)
       Reproduce la masa tridimensional del boceto con perspectiva oblicua a 54°
       ============================================================================== -->
  <g id="extrusion-3d">
    <!-- Bloque 3D bajo el ala de la S -->
    <path d="M 60,140 L 480,95 L 490,130 L 150,170 L 175,235 L 75,255 Z" fill="url(#block3D)" stroke="#1E293B" stroke-width="1.5" />
    
    <!-- Bloque 3D principal del cuerpo de la L -->
    <path d="M 330,190 L 530,105 L 560,170 L 350,375 L 300,320 Z" fill="url(#block3D)" stroke="#1E293B" stroke-width="1.5" />
    <path d="M 350,375 L 560,170 L 575,215 L 430,420 L 350,420 Z" fill="#090D15" stroke="#1E293B" stroke-width="1" />

    <!-- Bloque 3D de apoyo inferior bajo la Ö -->
    <path d="M 610,325 L 760,335 L 740,380 L 610,365 Z" fill="url(#block3D)" />
  </g>

  <!-- ==============================================================================
       CAPA 2: CARAS FRONTALES SOBERANAS (ORO NÓRDICO 24K Y LÍNEAS DE CORTE BLANCAS)
       ============================================================================== -->
  <g id="front-faces">
    <!-- ── 1. LETRA 'S' AERODINÁMICA ── -->
    <!-- Ala superior corrida con bisel de ataque -->
    <path d="M 50,120 L 490,75 L 510,105 L 210,140 L 310,165 L 140,245 L 65,230 L 160,185 L 50,120 Z" 
          fill="url(#goldFace)" 
          stroke="url(#rimLight)" 
          stroke-width="2.5" 
          stroke-linejoin="round" />

    <!-- ── 2. LETRA 'L' CON VÉRTICE Y ENLACE DE FASE ── -->
    <path d="M 320,165 L 460,95 L 535,145 L 340,345 L 275,290 L 410,185 Z" 
          fill="url(#goldFace)" 
          stroke="url(#rimLight)" 
          stroke-width="2.5" 
          stroke-linejoin="round" />

    <!-- ── 3. ANILLO 'Ö' TOROIDAL CON DIÉRESIS DE FASE (DOBLE SATÉLITE) ── -->
    <g transform="translate(680, 245)">
      <!-- Anillo Exterior de la O (Inclinación dinámica de 12° según boceto) -->
      <ellipse cx="0" cy="0" rx="92" ry="98" 
               fill="none" 
               stroke="url(#goldFace)" 
               stroke-width="32" 
               stroke-linecap="round" />
      <!-- Chaflanes de precisión -->
      <ellipse cx="0" cy="0" rx="108" ry="114" fill="none" stroke="url(#rimLight)" stroke-width="1.8" />
      <ellipse cx="0" cy="0" rx="76" ry="82" fill="none" stroke="url(#rimLight)" stroke-width="1.8" opacity="0.8" />

      <!-- Satélite Orbital Izquierdo (Alfa: Diámetro 38px) -->
      <g transform="translate(-46, -135)">
        <circle cx="0" cy="0" r="24" fill="url(#satGlow)" />
        <circle cx="0" cy="0" r="24" fill="none" stroke="url(#rimLight)" stroke-width="1.8" />
        <circle cx="0" cy="0" r="11" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.6" />
        <circle cx="0" cy="0" r="4" fill="#FFFFFF" />
      </g>

      <!-- Satélite Orbital Derecho (Beta: Diámetro 56px - Proporción asimétrica armónica del boceto) -->
      <g transform="translate(48, -145)">
        <circle cx="0" cy="0" r="34" fill="url(#satGlow)" />
        <circle cx="0" cy="0" r="34" fill="none" stroke="url(#rimLight)" stroke-width="2" />
        <circle cx="0" cy="0" r="16" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.6" />
        <circle cx="0" cy="0" r="5" fill="#FFFFFF" />
      </g>
    </g>

    <!-- ── 4. EXTENSIÓN SOBERANA N Y E (COMPLETANDO 'SLÖNE' EN EQUILIBRIO PERFECTO) ── -->
    <!-- Letra 'N' en bloque angulado a juego con la L -->
    <g transform="translate(815, 140)">
      <path d="M 0,140 L 0,30 L 26,20 L 58,110 L 58,10 L 82,0 L 82,125 L 56,135 L 24,45 L 24,148 Z" 
            fill="url(#goldFace)" 
            stroke="url(#rimLight)" 
            stroke-width="2" 
            stroke-linejoin="round" />
    </g>

    <!-- Letra 'E' cerrando el ala aerodinámica derecha -->
    <g transform="translate(915, 135)">
      <path d="M 0,150 L 0,15 L 68,0 L 72,25 L 26,34 L 26,70 L 60,65 L 62,88 L 26,93 L 26,128 L 72,120 L 75,145 Z" 
            fill="url(#goldFace)" 
            stroke="url(#rimLight)" 
            stroke-width="2" 
            stroke-linejoin="round" />
    </g>
  </g>

  <!-- ==============================================================================
       LÍNEAS DE CENTRADO CAD Y PROPORCIÓN ÁUREA G2 (GUÍAS DE INGENIERÍA)
       ============================================================================== -->
  <g opacity="0.3">
    <line x1="40" y1="440" x2="960" y2="440" stroke="#FFD700" stroke-width="1" stroke-dasharray="4 6" />
    <line x1="500" y1="40" x2="500" y2="460" stroke="#00F0FF" stroke-width="1" stroke-dasharray="2 4" />
    <circle cx="500" cy="250" r="4" fill="#00F0FF" />
  </g>
</svg>
