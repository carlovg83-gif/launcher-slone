<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <!-- FONDO NEGRO PURO -->
  <rect width="256" height="256" rx="56" fill="#000000"/>

  <!-- VERSIÓN MICRO: MÁXIMO CONTRASTE Y LEGIBILIDAD A TAMAÑO ICONO (16px a 48px) -->
  <g transform="translate(0, 10)">
    <!-- Máscara Optimizada para Icono -->
    <mask id="microMask">
      <rect width="256" height="256" fill="#FFFFFF"/>
      <!-- Hueco central reforzado -->
      <circle cx="128" cy="142" r="48" fill="#000000"/>
      <!-- Muesca superior visible -->
      <circle cx="128" cy="62" r="8" fill="#000000"/>
      <!-- Canal concéntrico amplio para evitar moiré -->
      <circle cx="128" cy="142" r="66" fill="none" stroke="#000000" stroke-width="5"/>
      <!-- Puentes del canal a 90 grados -->
      <line x1="128" y1="70" x2="128" y2="82" stroke="#FFFFFF" stroke-width="8"/>
      <line x1="128" y1="202" x2="128" y2="214" stroke="#FFFFFF" stroke-width="8"/>
      <line x1="56" y1="142" x2="68" y2="142" stroke="#FFFFFF" stroke-width="8"/>
      <line x1="188" y1="142" x2="200" y2="142" stroke="#FFFFFF" stroke-width="8"/>
    </mask>

    <!-- Anillo Sólido -->
    <circle cx="128" cy="142" r="84" fill="#E3FF00" mask="url(#microMask)"/>

    <!-- Cápsulas Diéresis Reforzadas -->
    <rect x="84" y="32" width="38" height="20" rx="10" fill="#E3FF00"/>
    <rect x="134" y="32" width="38" height="20" rx="10" fill="#E3FF00"/>
  </g>
</svg>
