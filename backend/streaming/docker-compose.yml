# ══════════════════════════════════════════════════════════════════════════
# SLÖNE™ SOVEREIGN STREAMING CLUSTER — DOCKER COMPOSE
# ══════════════════════════════════════════════════════════════════════════
# Despliegue en 1 clic de la red de origen y transcodificación de ultra-baja latencia
# ══════════════════════════════════════════════════════════════════════════

services:
  slone-origin:
    image: bluenviron/mediamtx:latest-ffmpeg
    container_name: slone-streaming-origin
    restart: unless-stopped
    ports:
      - "8554:8554"   # RTSP
      - "1935:1935"   # RTMP
      - "8888:8888"   # LL-HLS
      - "8889:8889"   # WebRTC TCP
      - "8889:8889/udp" # WebRTC UDP
      - "9997:9997"   # REST API
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    environment:
      - MTX_LOGLEVEL=info
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:9997/v3/config/global/get || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
