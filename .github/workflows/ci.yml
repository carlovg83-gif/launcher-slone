name: SLÖNE Sovereign OS CI & Validation

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Pruebas y Validación Soberana
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código Fuente
        uses: actions/checkout@v4

      - name: Configurar Entorno Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validar Sintaxis Python
        run: |
          python -m py_compile app/*.py scripts/*.py

      - name: Pruebas del Núcleo de Licencias Ed25519
        run: |
          python scripts/test_licencias.py

      - name: Pruebas Unitarias de Backend Node.js
        run: |
          node --check backend/server.js
          node --test backend/test.mjs

      - name: Validar Manifiesto de Diseño Stitch
        run: |
          node -e 'const s = JSON.parse(require("fs").readFileSync("stitch.json")); console.log("Stitch Config OK:", s.name);'
          node -e 'const f = JSON.parse(require("fs").readFileSync("stitch-figma-tokens.json")); console.log("Figma Tokens OK:", f.name);'
