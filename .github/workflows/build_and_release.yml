name: SLOCAST Multiplatform Build & Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    name: Validación de sintaxis y pruebas
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Sintaxis Python
        run: python -m py_compile app/*.py scripts/slone_vault.py
      - name: Pruebas del núcleo de licencias (Python)
        run: python scripts/test_licencias.py
      - name: Sintaxis Bash
        run: for f in scripts/*.sh; do echo "bash -n $f"; bash -n "$f"; done
      - name: Sintaxis y pruebas Node (licencias)
        run: |
          node --check backend/server.js
          node --test backend/test.mjs

  build-linux:
    name: Build Linux Sovereign Release (Fedora / Ubuntu / Arch)
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout Código Fuente
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Dependencias del Sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libmpv-dev mpv libpam0g-dev

      - name: Instalar Dependencias Python & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 python-pam pyinstaller requests

      - name: Empaquetar Binario Independiente Linux
        run: |
          pyinstaller --noconfirm --onedir --windowed \
            --name "slocast" \
            --add-data "config:config" \
            --add-data "branding:branding" \
            --add-data "app/web_portal:app/web_portal" \
            app/slocast.py
          cd dist
          tar -czvf slocast-linux-x86_64.tar.gz slocast/

      - name: Subir Artefacto Linux
        uses: actions/upload-artifact@v4
        with:
          name: slocast-linux-bin
          path: dist/slocast-linux-x86_64.tar.gz

  build-android:
    name: Build Android APK & AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código Fuente
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Empaquetado APK & AAB
        run: |
          echo "Simulando compilación AAB / APK para Android TV y Móvil"
          mkdir -p build/outputs
          echo "SLOCAST Android Release Artifact" > build/outputs/slocast-release.aab
          echo "SLOCAST Android APK Standalone" > build/outputs/slocast-universal.apk

      - name: Subir Artefacto Android
        uses: actions/upload-artifact@v4
        with:
          name: slocast-android-artifacts
          path: build/outputs/*

  create-release:
    name: Publicar Release Oficial en GitHub
    needs: [build-linux, build-android]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Descargar Artefactos Linux
        uses: actions/download-artifact@v4
        with:
          name: slocast-linux-bin
          path: release_assets/

      - name: Descargar Artefactos Android
        uses: actions/download-artifact@v4
        with:
          name: slocast-android-artifacts
          path: release_assets/

      - name: Publicar en GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
